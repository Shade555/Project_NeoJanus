<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Dashboard</title>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      background-color: #0a0a0a;
      color: white;
      overflow-x: hidden;
      height: 100vh;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 20px;
      height: 100%;
      box-sizing: border-box;
      align-items: stretch;
    }

    #map {
      height: 100%;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }

    .info-item {
      margin: 5px 0;
      font-size: 16px;
      line-height: 1.4;
    }

    .chart-container {
      height: 250px;
    }

    .card.large {
      flex-grow: 2;
    }

    .card.medium {
      flex-grow: 1;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 10px;
    }
    
    .error-message {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="dashboard">
    <div id="map"></div>

    <div class="sidebar">
      <!-- Disaster Chart -->
      <div class="card medium">
        <h3>Disaster Distribution</h3>
        <div class="chart-container">
          <canvas id="disasterChart"></canvas>
        </div>
        <div id="disaster-chart-error" class="error-message"></div>
      </div>

      <!-- Air Quality Info -->
      <div class="card medium">
        <h3>Air Quality Index (AQI)</h3>
        <div id="aqi-details">
          <p class="info-item"><strong>Location:</strong> <span id="aq-location">Loading...</span></p>
          <p class="info-item"><strong>City:</strong> <span id="aq-city">Loading...</span></p>
          <p class="info-item"><strong>State:</strong> <span id="aq-state">Loading...</span></p>
          <p class="info-item"><strong>Country:</strong> <span id="aq-country">Loading...</span></p>
          <p class="info-item"><strong>AQI Value:</strong> <span id="aq-value">Loading...</span></p>
          <p class="info-item"><strong>Last Updated:</strong> <span id="aq-updated">Loading...</span></p>
        </div>
        <div id="aqi-error" class="error-message"></div>
      </div>

      <!-- Additional Disaster Graph -->
      <div class="card medium">
        <h3>Disaster Events Over Time</h3>
        <div class="chart-container">
          <canvas id="disasterEventsChart"></canvas>
        </div>
        <div id="events-chart-error" class="error-message"></div>
      </div>

      <!-- Earthquake Magnitudes -->
      <div class="card large">
        <h3>Recent Earthquakes</h3>
        <div class="chart-container">
          <canvas id="earthquakeChart"></canvas>
        </div>
        <div id="earthquake-chart-error" class="error-message"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    &copy; 2025 Disaster Dashboard. All Rights Reserved.
  </div>

  <script>
    // Initialize Map
    const map = L.map('map').setView([20.5937, 78.9629], 4);

    // CartoDB Dark Theme
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CartoDB</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const lat = 28.6139;
    const lng = 77.2090;
    
    // Helper function to handle fetch errors
    async function fetchWithErrorHandling(url, errorElementId) {
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return await response.json();
      } catch (error) {
        console.error(`Error fetching data from ${url}:`, error);
        const errorElement = document.getElementById(errorElementId);
        if (errorElement) {
          errorElement.textContent = `Error: ${error.message || 'Failed to fetch data'}`;
        }
        return null;
      }
    }

    // Fetch disaster data
    fetchWithErrorHandling(`http://localhost:3000/disasters?lat=${lat}&lng=${lng}`, 'disaster-chart-error')
      .then(data => {
        if (!data || !data.disasters) return;
        
        data.disasters.forEach(disaster => {
          const { latitude, longitude, type, description } = disaster;
          L.circle([latitude, longitude], {
            color: getDisasterColor(type),
            fillColor: getDisasterColor(type),
            fillOpacity: 0.5,
            radius: 20000
          }).addTo(map).bindPopup(`<strong>${type}</strong><br>${description}`);
        });
      });
      
    // Get color based on disaster type
    function getDisasterColor(type) {
      const colors = {
        'Flood': '#48dbfb',
        'Fire': '#ff6b6b',
        'Storm': '#ff9f43',
        'Earthquake': '#1dd1a1'
      };
      return colors[type] || '#a55eea';
    }

    // Fetch AQI data
    fetchWithErrorHandling(`http://localhost:3000/aqi?lat=${lat}&lng=${lng}`, 'aqi-error')
      .then(data => {
        if (!data) return;
        
        // Check for different possible data structures
        let station;
        if (data.stations && data.stations[0]) {
          station = data.stations[0];
        } else if (data.data && data.data[0]) {
          station = data.data[0];
        } else {
          station = data; // Assume the data itself contains the AQI information
        }
        
        // Safely access nested properties with optional chaining
        document.getElementById('aq-location').innerText = 
          (station.station && station.station.name) || station.name || station.location || 'N/A';
        document.getElementById('aq-city').innerText = station.city || 'N/A';
        document.getElementById('aq-state').innerText = station.state || 'N/A';
        document.getElementById('aq-country').innerText = station.country || 'N/A';
        document.getElementById('aq-value').innerText = station.AQI || station.aqi || 'N/A';
        document.getElementById('aq-updated').innerText = station.lastUpdate || station.updatedAt || 'N/A';
      });

    // Disaster Distribution Pie Chart
    fetchWithErrorHandling(`http://localhost:3000/disasters?lat=${lat}&lng=${lng}`, 'disaster-chart-error')
      .then(data => {
        if (!data || !data.disasters) return;
        
        const disasterCounts = {
          Floods: 0,
          Fires: 0,
          Storms: 0,
          Earthquakes: 0
        };
        
        data.disasters.forEach(disaster => {
          if (disaster.type === 'Flood') disasterCounts.Floods++;
          if (disaster.type === 'Fire') disasterCounts.Fires++;
          if (disaster.type === 'Storm') disasterCounts.Storms++;
          if (disaster.type === 'Earthquake') disasterCounts.Earthquakes++;
        });

        const ctx = document.getElementById('disasterChart').getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Floods', 'Fires', 'Storms', 'Earthquakes'],
            datasets: [{
              data: [disasterCounts.Floods, disasterCounts.Fires, disasterCounts.Storms, disasterCounts.Earthquakes],
              backgroundColor: ['#48dbfb', '#ff6b6b', '#ff9f43', '#1dd1a1'],
              borderColor: '#0a0a0a',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: {
                  color: 'white'
                }
              }
            }
          }
        });
      });

    // Disaster Events Over Time Line Chart
    fetchWithErrorHandling(`http://localhost:3000/disasters?lat=${lat}&lng=${lng}`, 'events-chart-error')
      .then(data => {
        if (!data || !data.disasters) return;
        
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
        const eventCounts = months.map(month => {
          return data.disasters.filter(disaster => {
            const date = new Date(disaster.date);
            return date && date.getMonth() === months.indexOf(month);
          }).length;
        });

        const eventsCtx = document.getElementById('disasterEventsChart').getContext('2d');
        new Chart(eventsCtx, {
          type: 'line',
          data: {
            labels: months,
            datasets: [{
              label: 'Disasters',
              data: eventCounts,
              borderColor: '#48dbfb',
              backgroundColor: 'rgba(72, 219, 251, 0.2)',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: {
                  color: 'white'
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: 'white'
                }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: 'white',
                  precision: 0
                }
              }
            }
          }
        });
      });

    // Earthquake Magnitude Chart
    fetchWithErrorHandling('http://localhost:3000/earthquakes', 'earthquake-chart-error')
      .then(data => {
        if (!data || !data.earthquakes) return;
        
        const magnitudes = data.earthquakes.map(eq => eq.magnitude);
        const locations = data.earthquakes.map(eq => eq.location);
        const times = data.earthquakes.map(eq => {
          const date = new Date(eq.time);
          return date ? date.toLocaleDateString() : 'Unknown';
        });

        const earthquakeCtx = document.getElementById('earthquakeChart').getContext('2d');
        new Chart(earthquakeCtx, {
          type: 'bar',
          data: {
            labels: locations,
            datasets: [{
              label: 'Earthquake Magnitudes',
              data: magnitudes,
              backgroundColor: '#ff9f43',
              borderColor: '#e67e22',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              tooltip: {
                callbacks: {
                  afterLabel: function(context) {
                    return 'Date: ' + times[context.dataIndex];
                  }
                }
              },
              legend: {
                labels: {
                  color: 'white'
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: 'white'
                }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: 'white'
                }
              }
            }
          }
        });
      });
  </script> 
</body> 
</html>
