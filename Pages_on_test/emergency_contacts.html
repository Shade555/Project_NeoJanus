<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts</title>
    <link rel="stylesheet" href="emergency_contacts.css">
</head>
<body>
    <div class="container">
        <h2>Emergency Contacts</h2>
        <!-- <input type="text" id="search" placeholder="Search contacts..." onkeyup="filterContacts()"> -->

        <div id="contact-list" class="contact-group">
            <div class="contact" onclick="window.location.href='tel:112'">
                <div class="info">
                    <span>Emergency Helpline</span><br>
                    <span>📞 112</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:1078'">
                <div class="info">
                    <span>National Disaster Response Force (NDRF)</span><br>
                    <span>📞 011-24363260 / 1078</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:101'">
                <div class="info">
                    <span>Fire & Rescue</span><br>
                    <span>📞 101</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:100'">
                <div class="info">
                    <span>Police</span><br>
                    <span>📞 100</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:102'">
                <div class="info">
                    <span>Ambulance</span><br>
                    <span>📞 102 / 108</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:1092'">
                <div class="info">
                    <span>Earthquake Helpline</span><br>
                    <span>📞 1092</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:1070'">
                <div class="info">
                    <span>Rescue and Relief</span><br>
                    <span>📞 1070</span>
                </div>
            </div>

            <div class="contact" onclick="window.location.href='tel:108'">
                <div class="info">
                    <span>Emergency and Disaster Management</span><br>
                    <span>📞 108</span>
                </div>
            </div>
        </div>
    </div>

    <script src="emergency_contacts.js"></script>
</body>
</html>
